# Smoke-test config for discrete text flow matching.
# Goal: verify training loop, checkpointing, and resume wiring quickly.
# Usage:
#   uv run python training_text.py --config config_text_smoke.yaml

# Data
tokenizer: gpt2
dataset_name: openwebtext
dataset_config: null
text_file: null
split: train
max_documents: 2000
seq_len: 128
num_workers: 2

# Optimization / training loop
batch_size: 8
effective_batch: 32
total_steps: 200
log_every: 10
val_every: 50
ckpt_every: 100
lr: 0.0003
warmup_steps: 20
beta1: 0.9
beta2: 0.999
weight_decay: 0.0
schedule: square

# Model (small footprint for quick smoke)
dim: 256
n_layers: 4
n_heads: 8
ff_mult: 4
rope_theta: 10000.0
dropout: 0.1

# Runtime / checkpointing
use_amp: true
out_dir: ./runs/text_dfm_smoke
resume: null
auto_resume: true
seed: 42
device: null

# W&B (off by default for smoke runs)
use_wandb: false
wandb_project: mlmi4-text-dfm
wandb_entity: null
wandb_name: text-dfm-smoke
wandb_tags:
  - smoke
  - sanity-check
