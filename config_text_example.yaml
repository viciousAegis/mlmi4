# Text discrete flow-matching example config values
# Use with: python training_text.py --config config_text_example.yaml

tokenizer: gpt2
dataset_name: openwebtext
seq_len: 256
batch_size: 32
effective_batch: 512
total_steps: 300000
val_every: 2000
ckpt_every: 5000
lr: 0.0003
schedule: cubic
dim: 768
n_layers: 12
n_heads: 12
use_amp: true
use_wandb: false
wandb_project: mlmi4-text-dfm
